<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Panggung Dalang - Wayanusa</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo_2.png') }}">
    
    <!-- Font Awesome async -->
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    
    <!-- Google MediaPipe Pose & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    
    <style>
        /* =========================================
           1. LAYOUT DASAR
           ========================================= */
        body {
            margin: 0;
            background: #050505;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            user-select: none; /* Mencegah teks ter-highlight saat nge-drag */
        }

        .panggung {
            position: absolute;
            inset: 0;
            background: url("{{ url_for('static', filename='images/panggung.jpg') }}") center/cover no-repeat;
            filter: brightness(0.6);
            z-index: 1;
        }

        /* =========================================
           2. AREA PANGGUNG & TIRAI
           ========================================= */
        .stage-area {
            position: absolute;
            top: 12vh;
            left: 50%;
            transform: translateX(-50%);
            width: 75vw;
            height: 60vh;
            background: radial-gradient(circle at 50% 100%, rgba(255, 230, 180, 0.8) 0%, rgba(150, 100, 50, 0.4) 60%, rgba(0, 0, 0, 0.8) 100%);
            border: 6px solid #8B5A2B;
            border-bottom: 15px solid #5C3A21;
            border-radius: 8px 8px 2px 2px;
            overflow: hidden;
            z-index: 3;
            box-shadow: 
                0 0 50px rgba(0, 0, 0, 0.9) inset,
                0 0 30px rgba(212, 163, 115, 0.3),
                0 20px 40px rgba(0, 0, 0, 0.8);
        }

        .tirai-area {
            position: absolute;
            inset: 0;
            background: url("{{ url_for('static', filename='images/tirai2.png') }}") center/cover no-repeat;
            z-index: 10;
            pointer-events: none;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
        }

        /* =========================================
           3. UI CONTROLS (TOMBOL & TONG SAMPAH)
           ========================================= */
        .btn-add {
            width: 58px;
            height: 58px;
            background: linear-gradient(135deg, #D4A373, #B88656);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            color: #111;
            font-size: 24px;
            box-shadow: 0 5px 15px rgba(212, 163, 115, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn-add:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 25px rgba(212, 163, 115, 0.6);
            color: #fff;
        }

        .trash-bin {
            position: absolute;
            bottom: 15px;
            left: 15px;
            width: 50px;
            height: 50px;
            background: rgba(20, 20, 20, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: #888;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            pointer-events: auto;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(5px);
        }

        .trash-bin.active {
            background: rgba(220, 53, 69, 0.9);
            border-color: #ffaaaa;
            color: #fff;
            transform: scale(1.2);
            box-shadow: 0 0 20px rgba(220, 53, 69, 0.6);
        }

        /* =========================================
           4. LACI WAYANG (DRAWER)
           ========================================= */
        .wayang-list {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(150%);
            display: flex;
            gap: 15px;
            overflow-x: auto;
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 50;
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px 25px;
            border-radius: 20px;
            border: 1px solid rgba(212, 163, 115, 0.3);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
            max-width: 70vw;
        }

        .wayang-list::-webkit-scrollbar {
            height: 6px;
        }
        .wayang-list::-webkit-scrollbar-thumb {
            background: #D4A373;
            border-radius: 10px;
        }

        .wayang-list.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }

        .wayang-slot {
            width: 90px;
            height: 130px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 163, 115, 0.5);
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
            cursor: grab;
            transition: all 0.3s ease;
            position: relative;
        }

        .wayang-slot:hover {
            transform: translateY(-8px);
            border-color: #D4A373;
            box-shadow: 0 10px 20px rgba(212, 163, 115, 0.2);
            background: rgba(255, 255, 255, 0.1);
        }

        .wayang-slot img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));
        }

        /* =========================================
           5. WAYANG FISIK DI PANGGUNG
           ========================================= */
        .wayang {
            position: absolute;
            width: 260px;
            height: 420px;
            cursor: grab;
            filter: drop-shadow(5px 15px 10px rgba(0,0,0,0.6));
            transition: filter 0.2s;
        }

        .wayang:active {
            cursor: grabbing;
            filter: drop-shadow(15px 25px 15px rgba(0,0,0,0.4));
        }

        .wayang .badan {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            z-index: 2;
        }

        .wayang .tangan {
            position: absolute;
        }

        /* --- TANGAN BELAKANG (KANAN) --- */
        .wayang .tangan.kanan {
            left: 170px;
            top: 97px;
            z-index: 3;
        }

        /* --- TANGAN DEPAN (KIRI) --- */
        .wayang .tangan.kiri {
            left: 25px;
            top: 130px;
            z-index: 4;
        }

        .wayang .lengan-atas {
            position: relative;
            width: 60px;
            height: 120px;
            transform-origin: 37px 7px;
            cursor: pointer;
        }

        .wayang .lengan-atas img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .wayang .lengan-bawah {
            position: absolute;
            top: 105px;
            left: 0;
            width: 80px;
            height: 130px;
            transform-origin: 30px 4px;
            cursor: pointer;
        }

        .wayang .lengan-bawah img {
            position: absolute;
            left: -40px;
            top: -5px;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        /* =========================================
           6. KAMERA AI & MOTION TRACKING UI
           ========================================= */
        .btn-cam {
            height: 58px;
            padding: 0 22px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid #38bdf8;
            border-radius: 29px;
            cursor: pointer;
            color: #38bdf8;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.8), 0 0 15px rgba(56, 189, 248, 0.35);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .btn-cam:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.6);
            color: #fff;
            border-color: #fff;
        }

        .btn-cam.active {
            background: linear-gradient(135deg, #065f46, #047857);
            border-color: #34d399;
            color: #fff;
            box-shadow: 0 0 25px rgba(52, 211, 153, 0.9);
            animation: pulse-cam 2s infinite;
        }

        @keyframes pulse-cam {
            0% { box-shadow: 0 0 10px rgba(52, 211, 153, 0.4); }
            50% { box-shadow: 0 0 25px rgba(52, 211, 153, 0.85); }
            100% { box-shadow: 0 0 10px rgba(52, 211, 153, 0.4); }
        }

        /* Floating PIP Camera Window */
        .cam-preview-box {
            position: fixed;
            bottom: 95px;
            right: 35px;
            width: 260px;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid rgba(212, 163, 115, 0.5);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            z-index: 1000;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .bottom-bar-actions {
            position: fixed;
            bottom: 25px;
            right: 35px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 999;
        }

        .cam-preview-box.show {
            display: flex;
        }

        .cam-header {
            padding: 9px 14px;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: #D4A373;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .cam-header .cam-status {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .cam-header .dot {
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            display: inline-block;
            transition: background 0.3s;
        }

        .cam-header .dot.active {
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        .btn-close-cam {
            background: none;
            border: none;
            color: #888;
            font-size: 14px;
            cursor: pointer;
            padding: 2px 5px;
            transition: color 0.2s;
        }

        .btn-close-cam:hover {
            color: #ff5555;
        }

        .cam-video-wrap {
            position: relative;
            width: 100%;
            height: 170px;
            background: #000;
        }

        .cam-video-wrap video {
            display: none;
        }

        .cam-video-wrap canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror display */
        }

        .cam-hint {
            padding: 7px 10px;
            font-size: 11px;
            color: #d1d5db;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body>
    {% include 'layouts/navbar.html' %}

    <div class="panggung"></div>

    <div class="stage-area" id="stageArea">
        <div class="tirai-area"></div>
        <div class="trash-bin" id="trashBin"><i class="fas fa-trash-alt"></i></div>
    </div>

    <div class="wayang-list" id="wayangList">
        {% for w in wayangs %}
        <div class="wayang-slot"
            draggable="true"
            data-badan="{{ url_for('static', filename=w.badan) }}"
            data-tka="{{ url_for('static', filename=w.tangan_kanan_atas) }}"
            data-tkb="{{ url_for('static', filename=w.tangan_kanan_bawah) }}"
            data-tla="{{ url_for('static', filename=w.tangan_kiri_atas) }}"
            data-tlb="{{ url_for('static', filename=w.tangan_kiri_bawah) }}">
            <img src="{{ url_for('static', filename=w.thumbnail) }}" loading="lazy">
        </div>
        {% endfor %}
    </div>

    <div class="bottom-bar-actions">
        <button class="btn-cam" id="btnCam" title="Aktifkan Kamera AI Gerak Tangan">
            <i class="fas fa-video"></i>
            <span id="btnCamText">Kamera AI</span>
        </button>
        <button class="btn-add" id="btnAdd" title="Buka Laci Wayang">
            <i class="fas fa-box-open"></i>
        </button>
    </div>

    <!-- Floating PIP Camera Box -->
    <div class="cam-preview-box" id="camPreviewBox">
        <div class="cam-header">
            <span class="cam-status">
                <span class="dot" id="camDot"></span>
                <span id="camStatusText">Kamera AI: Aktif</span>
            </span>
            <button class="btn-close-cam" id="btnCloseCam" title="Tutup Kamera">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="cam-video-wrap">
            <video id="webcamVideo" playsinline muted></video>
            <canvas id="webcamCanvas" width="320" height="240"></canvas>
        </div>
        <div class="cam-hint" id="camHint">Gerakkan tangan Anda di depan webcam ✨</div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const stage = document.getElementById("stageArea");
            const trash = document.getElementById("trashBin");
            const btnAdd = document.getElementById("btnAdd");
            const wayangList = document.getElementById("wayangList");
            let draggedSlot = null;

            // Toggle Laci
            btnAdd.onclick = () => {
                wayangList.classList.toggle("show");
                // Ganti icon saat buka/tutup
                if(wayangList.classList.contains("show")) {
                    btnAdd.innerHTML = '<i class="fas fa-times"></i>';
                } else {
                    btnAdd.innerHTML = '<i class="fas fa-box-open"></i>';
                }
            };

            // Setup Dragging Slot
            document.querySelectorAll(".wayang-slot").forEach(slot => {
                // 1. Saat mulai ditarik, biarkan laci tetap terbuka
                slot.addEventListener("dragstart", (e) => { 
                    draggedSlot = slot; 
                });

                // 2. Saat tarikan selesai (wayang dilepas ke panggung), baru lacinya ditutup
                slot.addEventListener("dragend", () => {
                    wayangList.classList.remove("show");
                    btnAdd.innerHTML = '<i class="fas fa-box-open"></i>';
                });
            });

            stage.addEventListener("dragover", e => e.preventDefault());

            stage.addEventListener("drop", e => {
                e.preventDefault();
                if (!draggedSlot) return;
                const rect = stage.getBoundingClientRect();

                const wayang = document.createElement("div");
                wayang.className = "wayang";
                wayang.style.left = (e.clientX - rect.left - 45) + "px";
                wayang.style.top = (e.clientY - rect.top - 70) + "px";
                wayang.flipped = false;

                wayang.innerHTML = `
                <img class="badan" src="${draggedSlot.dataset.badan}">
                <div class="tangan kanan">
                    <div class="lengan-atas">
                        <img src="${draggedSlot.dataset.tka}">
                        <div class="lengan-bawah">
                            <img src="${draggedSlot.dataset.tkb}">
                        </div>
                    </div>
                </div>
                <div class="tangan kiri">
                    <div class="lengan-atas">
                        <img src="${draggedSlot.dataset.tla}">
                        <div class="lengan-bawah">
                            <img src="${draggedSlot.dataset.tlb}">
                        </div>
                    </div>
                </div>
                `;

                stage.appendChild(wayang);
                enableStageDrag(wayang);
                aktifkanRotasiTangan(wayang);
                fallDown(wayang);
                enableDoubleClickFlip(wayang);

                draggedSlot = null;

                // Pose Awal
                const tKA = wayang.querySelector('.tangan.kanan .lengan-atas');
                const tKB = wayang.querySelector('.tangan.kanan .lengan-bawah');
                const tLA = wayang.querySelector('.tangan.kiri .lengan-atas');
                const tLB = wayang.querySelector('.tangan.kiri .lengan-bawah');

                if(tKA) tKA.style.transform = 'rotate(-20deg)';
                if(tKB) tKB.style.transform = 'rotate(25deg)';
                if(tLA) tLA.style.transform = 'rotate(25deg)';
                if(tLB) tLB.style.transform = 'rotate(35deg)';
            });

            // LOGIKA DRAG & DROP DALAM PANGGUNG (Tidak diubah, murni buatan Mas)
            function enableStageDrag(el) {
                let isDrag = false, offsetX = 0, offsetY = 0;
                el.addEventListener("mousedown", e => {
                    isDrag = true;
                    offsetX = e.offsetX;
                    offsetY = e.offsetY;
                    el.falling = false;
                    document.addEventListener("mousemove", move);
                    document.addEventListener("mouseup", up);
                });
                function move(e) {
                    if (!isDrag) return;
                    const r = stage.getBoundingClientRect();
                    let x = e.clientX - r.left - offsetX;
                    let y = e.clientY - r.top - offsetY;
                    x = Math.max(0, Math.min(r.width - el.clientWidth, x));
                    y = Math.max(0, Math.min(r.height - el.clientHeight, y));
                    el.style.left = x + "px";
                    el.style.top = y + "px";
                    trash.classList.toggle("active", isOverTrash(el));
                }
                function up() {
                    isDrag = false;
                    if (isOverTrash(el)) el.remove();
                    else fallDown(el);
                    trash.classList.remove("active");
                    document.removeEventListener("mousemove", move);
                    document.removeEventListener("mouseup", up);
                }
            }

            // =========================================
            // LOGIKA ROTASI SENDI DENGAN BATAS ANATOMIS (PUPPET CLAMPING)
            // Mencegah siku dan bahu berputar 360 derajat layaknya anatomi tangan manusia
            // =========================================
            function aktifkanRotasiTangan(wayang) {
                wayang.querySelectorAll('.tangan').forEach(tangan => {
                    const isKanan = tangan.classList.contains('kanan');
                    const atas = tangan.querySelector('.lengan-atas');
                    const bawah = tangan.querySelector('.lengan-bawah');
                    if (atas && bawah) {
                        aktifkanSendi(atas, bawah, isKanan);
                    }
                });
            }

            function aktifkanSendi(atas, bawah, isKanan) {
                let startY = 0, startAtas = 0, startBawah = 0, mode = null;

                atas.addEventListener('mousedown', e => {
                    e.stopPropagation();
                    mode = 'atas';
                    startY = e.clientY;
                    startAtas = getRotation(atas);
                    startBawah = getRotation(bawah);
                    bind();
                });

                bawah.addEventListener('mousedown', e => {
                    e.stopPropagation();
                    mode = 'bawah';
                    startY = e.clientY;
                    startAtas = getRotation(atas);
                    startBawah = getRotation(bawah);
                    bind();
                });

                function bind() {
                    document.addEventListener('mousemove', move);
                    document.addEventListener('mouseup', unbind);
                }

                function move(e) {
                    const delta = startY - e.clientY; // Tarik mouse ke atas = nilai positif

                    if (mode === 'atas') {
                        // Bahu (Lengan Atas) - rentang ayunan wajar
                        let newA = startAtas + delta * 0.7;
                        newA = Math.max(-90, Math.min(140, newA));
                        atas.style.transform = `rotate(${Math.round(newA)}deg)`;
                    }

                    if (mode === 'bawah') {
                        // Siku (Lengan Bawah) - TERKUNCI ANATOMIS:
                        // Baik tangan kiri maupun kanan, siku menekuk ke arah DEPAN (+135deg),
                        // dan lurus di (-10deg). Siku TIDAK BISA ditekuk ke belakang (hiperekstensi).
                        let newB = startBawah + delta * 0.8;
                        newB = Math.max(-10, Math.min(135, newB));
                        bawah.style.transform = `rotate(${Math.round(newB)}deg)`;
                    }
                }

                function unbind() {
                    document.removeEventListener('mousemove', move);
                    document.removeEventListener('mouseup', unbind);
                }
            }

            function getRotation(el){
                const st = window.getComputedStyle(el).transform;
                if(st==='none') return 0;
                const m=st.match(/matrix\(([^)]+)\)/); if(!m) return 0;
                const v=m[1].split(','); return Math.round(Math.atan2(v[1],v[0])*180/Math.PI);
            }

            function isOverTrash(el){
                const w=el.getBoundingClientRect(), t=trash.getBoundingClientRect();
                // Memberi sedikit margin agar lebih pas
                return !(w.right < t.left - 20 || w.left > t.right + 20 || w.bottom < t.top - 20 || w.top > t.bottom + 20);
            }

            function fallDown(el){
                if(el.falling) return; el.falling=true;
                const rect=stage.getBoundingClientRect();
                const bottom = rect.height - el.clientHeight;
                let y = parseInt(el.style.top)||0;
                const fall=setInterval(()=>{
                    y+=4;
                    if(y>=bottom){ y=bottom; clearInterval(fall); el.falling=false; }
                    el.style.top = y + "px";
                },10);
            }

            function enableDoubleClickFlip(wayang){
                wayang.addEventListener('dblclick', ()=>{
                    wayang.flipped = !wayang.flipped;
                    if(wayang.flipped) wayang.style.transform += ' scaleX(-1)';
                    else wayang.style.transform = wayang.style.transform.replace(' scaleX(-1)','');
                });
            }

            // =========================================
            // 7. SISTEM AI MOTION TRACKING (MEDIAPIPE)
            // =========================================
            const btnCam = document.getElementById("btnCam");
            const btnCamText = document.getElementById("btnCamText");
            const btnCloseCam = document.getElementById("btnCloseCam");
            const camPreviewBox = document.getElementById("camPreviewBox");
            const webcamVideo = document.getElementById("webcamVideo");
            const webcamCanvas = document.getElementById("webcamCanvas");
            const camCtx = webcamCanvas.getContext("2d");
            const camDot = document.getElementById("camDot");
            const camStatusText = document.getElementById("camStatusText");
            const camHint = document.getElementById("camHint");

            let isAiRunning = false;
            let cameraInstance = null;
            let poseInstance = null;

            // Smoothed angles for smooth movement without jitter
            let currentAngles = {
                LA: 25, LB: 35,
                KA: -20, KB: 25
            };

            btnCam.addEventListener("click", () => {
                if (isAiRunning) {
                    stopCameraAI();
                } else {
                    startCameraAI();
                }
            });

            btnCloseCam.addEventListener("click", () => {
                stopCameraAI();
            });

            async function startCameraAI() {
                if (typeof Pose === "undefined" || typeof Camera === "undefined") {
                    alert("Sedang memuat library AI MediaPipe, mohon pastikan internet aktif dan coba lagi dalam beberapa detik.");
                    return;
                }

                camPreviewBox.classList.add("show");
                btnCam.classList.add("active");
                btnCam.innerHTML = '<i class="fas fa-video-slash"></i> <span id="btnCamText">Matikan AI</span>';
                camStatusText.innerText = "Memulai Kamera...";
                camDot.classList.remove("active");

                try {
                    if (!poseInstance) {
                        poseInstance = new Pose({
                            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
                        });

                        poseInstance.setOptions({
                            modelComplexity: 1,
                            smoothLandmarks: true,
                            enableSegmentation: false,
                            minDetectionConfidence: 0.5,
                            minTrackingConfidence: 0.5
                        });

                        poseInstance.onResults(onPoseResults);
                    }

                    cameraInstance = new Camera(webcamVideo, {
                        onFrame: async () => {
                            if (isAiRunning && webcamVideo.videoWidth > 0) {
                                await poseInstance.send({ image: webcamVideo });
                            }
                        },
                        width: 320,
                        height: 240
                    });

                    await cameraInstance.start();
                    isAiRunning = true;
                    camStatusText.innerText = "Mendeteksi Tubuh...";

                    // Sinkronisasi sudut awal dari wayang di panggung agar tidak terjadi hentakan posisi
                    const firstWayang = stage.querySelector(".wayang");
                    if (firstWayang) {
                        const wLA = firstWayang.querySelector('.tangan.kiri .lengan-atas');
                        const wLB = firstWayang.querySelector('.tangan.kiri .lengan-bawah');
                        const wKA = firstWayang.querySelector('.tangan.kanan .lengan-atas');
                        const wKB = firstWayang.querySelector('.tangan.kanan .lengan-bawah');
                        if (wLA) currentAngles.LA = getRotation(wLA);
                        if (wLB) currentAngles.LB = getRotation(wLB);
                        if (wKA) currentAngles.KA = getRotation(wKA);
                        if (wKB) currentAngles.KB = getRotation(wKB);
                    }
                } catch (err) {
                    console.error("Camera AI Error:", err);
                    alert("Gagal mengakses kamera: " + (err.message || "Izin kamera ditolak."));
                    stopCameraAI();
                }
            }

            function stopCameraAI() {
                isAiRunning = false;
                if (cameraInstance) {
                    try { cameraInstance.stop(); } catch(e){}
                }
                if (webcamVideo.srcObject) {
                    webcamVideo.srcObject.getTracks().forEach(track => track.stop());
                    webcamVideo.srcObject = null;
                }

                camPreviewBox.classList.remove("show");
                btnCam.classList.remove("active");
                btnCam.innerHTML = '<i class="fas fa-video"></i> <span id="btnCamText">Kamera AI</span>';
                camDot.classList.remove("active");
                camStatusText.innerText = "Kamera Nonaktif";

                camCtx.clearRect(0, 0, webcamCanvas.width, webcamCanvas.height);
            }

            function onPoseResults(results) {
                if (!isAiRunning) return;

                camCtx.save();
                camCtx.clearRect(0, 0, webcamCanvas.width, webcamCanvas.height);
                camCtx.drawImage(results.image, 0, 0, webcamCanvas.width, webcamCanvas.height);

                if (results.poseLandmarks) {
                    const lm = results.poseLandmarks;
                    camDot.classList.add("active");
                    camStatusText.innerText = "Tangan Terdeteksi ✨";

                    // Helper to draw skeleton arms
                    drawArm(11, 13, 15, lm, "#00e5ff"); // Cyan for front arm
                    drawArm(12, 14, 16, lm, "#ffd166"); // Gold for back arm

                    // Helper to smooth angles across -180/180 boundary
                    function smoothAngle(current, target, rate = 0.28) {
                        let diff = target - current;
                        while (diff > 180) diff -= 360;
                        while (diff < -180) diff += 360;
                        return current + diff * rate;
                    }

                    // --- MAPPING KE TANGAN DEPAN WAYANG (Sisi Kiri Layar - lm 11, 13, 15) ---
                    if (lm[11] && lm[13] && lm[11].visibility > 0.4 && lm[13].visibility > 0.4) {
                        // Inversi dx agar gerak ke kanan/kiri di kamera mirror langsung searah (bukan terbalik)
                        const dxU = -(lm[13].x - lm[11].x);
                        const dyU = lm[13].y - lm[11].y;
                        const angU = Math.atan2(dyU, dxU) * 180 / Math.PI;

                        let targetLA = angU - 90;
                        while (targetLA > 180) targetLA -= 360;
                        while (targetLA < -180) targetLA += 360;
                        targetLA = Math.max(-90, Math.min(140, targetLA));

                        let targetLB = 0;
                        if (lm[15] && lm[15].visibility > 0.3) {
                            const dxF = -(lm[15].x - lm[13].x);
                            const dyF = lm[15].y - lm[13].y;
                            const angF = Math.atan2(dyF, dxF) * 180 / Math.PI;
                            let diff = angF - angU;
                            while (diff > 180) diff -= 360;
                            while (diff < -180) diff += 360;
                            // Batas anatomis siku depan: lurus (-10deg) s/d tekuk ke depan (+140deg)
                            targetLB = Math.max(-10, Math.min(140, diff));
                        }

                        currentAngles.LA = smoothAngle(currentAngles.LA, targetLA, 0.28);
                        currentAngles.LB = smoothAngle(currentAngles.LB, targetLB, 0.28);
                    }

                    // --- MAPPING KE TANGAN BELAKANG WAYANG (Sisi Kanan Layar - lm 12, 14, 16) ---
                    if (lm[12] && lm[14] && lm[12].visibility > 0.4 && lm[14].visibility > 0.4) {
                        // Inversi dx agar gerak ke kanan/kiri di kamera mirror langsung searah (bukan terbalik)
                        const dxU_R = -(lm[14].x - lm[12].x);
                        const dyU_R = lm[14].y - lm[12].y;
                        const angU_R = Math.atan2(dyU_R, dxU_R) * 180 / Math.PI;

                        let targetKA = angU_R - 90;
                        while (targetKA > 180) targetKA -= 360;
                        while (targetKA < -180) targetKA += 360;
                        targetKA = Math.max(-90, Math.min(140, targetKA));

                        let targetKB = 0;
                        if (lm[16] && lm[16].visibility > 0.3) {
                            const dxF_R = -(lm[16].x - lm[14].x);
                            const dyF_R = lm[16].y - lm[14].y;
                            const angF_R = Math.atan2(dyF_R, dxF_R) * 180 / Math.PI;
                            let diffR = angF_R - angU_R;
                            while (diffR > 180) diffR -= 360;
                            while (diffR < -180) diffR += 360;
                            // Batas anatomis siku belakang: lurus (-10deg) s/d tekuk ke depan (+140deg)
                            targetKB = Math.max(-10, Math.min(140, diffR));
                        }

                        currentAngles.KA = smoothAngle(currentAngles.KA, targetKA, 0.28);
                        currentAngles.KB = smoothAngle(currentAngles.KB, targetKB, 0.28);
                    }

                    // Terapkan ke semua wayang di panggung
                    const puppets = stage.querySelectorAll(".wayang");
                    if (puppets.length === 0) {
                        camHint.innerText = "Tarik wayang dari laci ke panggung!";
                    } else {
                        camHint.innerText = "Gerakkan lengan Anda di depan kamera ✨";
                        puppets.forEach(wayang => {
                            const wLA = wayang.querySelector('.tangan.kiri .lengan-atas');
                            const wLB = wayang.querySelector('.tangan.kiri .lengan-bawah');
                            const wKA = wayang.querySelector('.tangan.kanan .lengan-atas');
                            const wKB = wayang.querySelector('.tangan.kanan .lengan-bawah');

                            if (wLA) wLA.style.transform = `rotate(${Math.round(currentAngles.LA)}deg)`;
                            if (wLB) wLB.style.transform = `rotate(${Math.round(currentAngles.LB)}deg)`;
                            if (wKA) wKA.style.transform = `rotate(${Math.round(currentAngles.KA)}deg)`;
                            if (wKB) wKB.style.transform = `rotate(${Math.round(currentAngles.KB)}deg)`;
                        });
                    }

                } else {
                    camDot.classList.remove("active");
                    camStatusText.innerText = "Mencari Tubuh Manusia...";
                }
                camCtx.restore();
            }

            function drawArm(sIdx, eIdx, wIdx, lm, color) {
                if (!lm[sIdx] || !lm[eIdx] || !lm[wIdx]) return;
                const cw = webcamCanvas.width;
                const ch = webcamCanvas.height;

                camCtx.lineWidth = 4;
                camCtx.strokeStyle = color;
                camCtx.fillStyle = color;

                // Garis Bahu -> Siku -> Pergelangan
                camCtx.beginPath();
                camCtx.moveTo(lm[sIdx].x * cw, lm[sIdx].y * ch);
                camCtx.lineTo(lm[eIdx].x * cw, lm[eIdx].y * ch);
                camCtx.lineTo(lm[wIdx].x * cw, lm[wIdx].y * ch);
                camCtx.stroke();

                // Titik Sendi
                [sIdx, eIdx, wIdx].forEach(idx => {
                    camCtx.beginPath();
                    camCtx.arc(lm[idx].x * cw, lm[idx].y * ch, 5, 0, 2 * Math.PI);
                    camCtx.fill();
                });
            }
        });
    </script>
</body>
