<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Panggung Dalang - Wayanusa</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo_2.png') }}">
    
    <!-- Font Awesome async -->
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    
    <style>
        /* =========================================
           1. LAYOUT DASAR
           ========================================= */
        body {
            margin: 0;
            background: #050505;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            user-select: none; /* Mencegah teks ter-highlight saat nge-drag */
        }

        .panggung {
            position: absolute;
            inset: 0;
            background: url("{{ url_for('static', filename='images/panggung.jpg') }}") center/cover no-repeat;
            filter: brightness(0.6);
            z-index: 1;
        }

        /* =========================================
           2. AREA PANGGUNG & TIRAI
           ========================================= */
        .stage-area {
            position: absolute;
            top: 12vh;
            left: 50%;
            transform: translateX(-50%);
            width: 75vw;
            height: 60vh;
            background: radial-gradient(circle at 50% 100%, rgba(255, 230, 180, 0.8) 0%, rgba(150, 100, 50, 0.4) 60%, rgba(0, 0, 0, 0.8) 100%);
            border: 6px solid #8B5A2B;
            border-bottom: 15px solid #5C3A21;
            border-radius: 8px 8px 2px 2px;
            overflow: hidden;
            z-index: 3;
            box-shadow: 
                0 0 50px rgba(0, 0, 0, 0.9) inset,
                0 0 30px rgba(212, 163, 115, 0.3),
                0 20px 40px rgba(0, 0, 0, 0.8);
        }

        .tirai-area {
            position: absolute;
            inset: 0;
            background: url("{{ url_for('static', filename='images/tirai2.png') }}") center/cover no-repeat;
            z-index: 10;
            pointer-events: none;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
        }

        /* =========================================
           3. UI CONTROLS (TOMBOL & TONG SAMPAH)
           ========================================= */
        .btn-add {
            position: absolute;
            bottom: 30px;
            right: 40px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #D4A373, #B88656);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            color: #111;
            font-size: 24px;
            z-index: 60;
            box-shadow: 0 5px 15px rgba(212, 163, 115, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-add:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 25px rgba(212, 163, 115, 0.6);
            color: #fff;
        }

        .trash-bin {
            position: absolute;
            bottom: 15px;
            left: 15px;
            width: 50px;
            height: 50px;
            background: rgba(20, 20, 20, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: #888;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            pointer-events: auto;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(5px);
        }

        .trash-bin.active {
            background: rgba(220, 53, 69, 0.9);
            border-color: #ffaaaa;
            color: #fff;
            transform: scale(1.2);
            box-shadow: 0 0 20px rgba(220, 53, 69, 0.6);
        }

        /* =========================================
           4. LACI WAYANG (DRAWER)
           ========================================= */
        .wayang-list {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(150%);
            display: flex;
            gap: 15px;
            overflow-x: auto;
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 50;
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px 25px;
            border-radius: 20px;
            border: 1px solid rgba(212, 163, 115, 0.3);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
            max-width: 70vw;
        }

        .wayang-list::-webkit-scrollbar {
            height: 6px;
        }
        .wayang-list::-webkit-scrollbar-thumb {
            background: #D4A373;
            border-radius: 10px;
        }

        .wayang-list.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }

        .wayang-slot {
            width: 90px;
            height: 130px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 163, 115, 0.5);
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
            cursor: grab;
            transition: all 0.3s ease;
            position: relative;
        }

        .wayang-slot:hover {
            transform: translateY(-8px);
            border-color: #D4A373;
            box-shadow: 0 10px 20px rgba(212, 163, 115, 0.2);
            background: rgba(255, 255, 255, 0.1);
        }

        .wayang-slot img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));
        }

        /* =========================================
           5. WAYANG FISIK DI PANGGUNG
           ========================================= */
        .wayang {
            position: absolute;
            width: 260px;
            height: 420px;
            cursor: grab;
            filter: drop-shadow(5px 15px 10px rgba(0,0,0,0.6));
            transition: filter 0.2s;
        }

        .wayang:active {
            cursor: grabbing;
            filter: drop-shadow(15px 25px 15px rgba(0,0,0,0.4));
        }

        .wayang .badan {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .wayang .tangan {
            position: absolute;
        }

        .wayang .tangan.kanan { left: 170px; top: 97px; }
        .wayang .tangan.kiri { left: 25px; top: 130px; }

        .wayang .lengan-atas {
            position: relative;
            width: 60px;
            height: 120px;
            transform-origin: 37px 7px;
            cursor: pointer;
        }

        .wayang .lengan-atas img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }

        .wayang .lengan-bawah {
            position: absolute;
            top: 105px;
            left: 0;
            width: 80px;
            height: 130px;
            transform-origin: 30px 4px;
            cursor: pointer;
        }

        .wayang .lengan-bawah img {
            position: absolute;
            left: -40px;
            top: -5px;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        /* =========================================
           6. TOMBOL LANSKAP & NOTIFIKASI ORIENTASI
           ========================================= */
        .btn-landscape-mode {
            position: fixed;
            top: 25px;
            right: 85px;
            z-index: 1002;
            background: rgba(20, 20, 20, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 163, 115, 0.4);
            color: #D4A373;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .btn-landscape-mode:hover {
            background: #D4A373;
            color: #000;
            border-color: #fff;
            transform: translateY(-2px);
        }

        .rotate-notice-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 5, 0.92);
            backdrop-filter: blur(14px);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .rotate-notice-card {
            background: #141416;
            border: 1.5px solid rgba(212, 163, 115, 0.35);
            border-radius: 22px;
            padding: 30px 24px;
            text-align: center;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(212, 163, 115, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .rotate-anim-box {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 5px;
        }

        .phone-icon {
            font-size: 3rem;
            color: #D4A373;
            animation: rotatePhone 2.5s infinite ease-in-out;
        }

        .arrow-icon {
            position: absolute;
            font-size: 1.4rem;
            color: #fff;
            animation: spinArrow 2.5s infinite linear;
        }

        @keyframes rotatePhone {
            0%, 20% { transform: rotate(0deg); }
            50%, 80% { transform: rotate(-90deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes spinArrow {
            0% { transform: rotate(0deg); opacity: 0.8; }
            50% { transform: rotate(-180deg); opacity: 1; }
            100% { transform: rotate(-360deg); opacity: 0.8; }
        }

        .rotate-notice-card h4 {
            color: #D4A373;
            font-size: 1.25rem;
            margin: 0;
        }

        .rotate-notice-card p {
            color: #ccc;
            font-size: 0.88rem;
            line-height: 1.5;
            margin: 0;
        }

        .rotate-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin-top: 10px;
        }

        .btn-rotate-now {
            background: linear-gradient(135deg, #D4A373, #B88656);
            border: none;
            color: #000;
            font-weight: 700;
            font-size: 0.92rem;
            padding: 13px 20px;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s;
        }

        .btn-rotate-now:hover {
            box-shadow: 0 0 20px rgba(212, 163, 115, 0.5);
            transform: scale(1.02);
        }

        .btn-rotate-skip {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #888;
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-rotate-skip:hover {
            color: #fff;
            border-color: #666;
        }

        /* Munculkan prompt jika smartphone dalam posisi tegak (potret) */
        @media (max-width: 900px) and (orientation: portrait) {
            .rotate-notice-overlay.active {
                display: flex;
            }
        }

        /* =========================================
           7. RESPONSIVE POTRET (SMARTPHONE TEGAK)
           ========================================= */
        @media (max-width: 768px) {
            .btn-landscape-mode {
                top: 20px;
                right: 75px;
                padding: 6px 12px;
                font-size: 0.75rem;
            }

            .stage-area {
                top: 85px;
                width: 95vw;
                height: 65vh;
                max-height: calc(100vh - 170px);
                border: 4px solid #8B5A2B;
                border-bottom: 10px solid #5C3A21;
                border-radius: 12px 12px 4px 4px;
            }

            .wayang {
                width: 190px;
                height: 310px;
                transform-origin: top left;
            }

            .wayang .tangan.kanan { left: 125px; top: 72px; }
            .wayang .tangan.kiri { left: 18px; top: 96px; }

            .wayang .lengan-atas {
                width: 44px;
                height: 88px;
                transform-origin: 27px 5px;
            }

            .wayang .lengan-bawah {
                top: 77px;
                width: 58px;
                height: 95px;
                transform-origin: 22px 3px;
            }

            .wayang .lengan-bawah img {
                left: -30px;
                top: -4px;
            }

            .btn-add {
                bottom: 20px;
                right: 20px;
                width: 52px;
                height: 52px;
                font-size: 20px;
            }

            .trash-bin {
                bottom: 15px;
                left: 15px;
                width: 44px;
                height: 44px;
                font-size: 18px;
            }

            .wayang-list {
                bottom: 18px;
                max-width: 94vw;
                padding: 14px 16px;
                gap: 12px;
                border-radius: 16px;
            }

            .wayang-slot {
                width: 72px;
                height: 105px;
            }
        }

        /* =========================================
           8. RESPONSIVE LANSKAP (PANGGUNG LEBAR HORIZONTAL)
           ========================================= */
        @media (orientation: landscape) and (max-height: 600px) {
            .navbar {
                display: none !important; /* Hilangkan navbar di mode lanskap HP agar layar 100% untuk panggung */
            }

            .btn-landscape-mode {
                top: 12px;
                right: 15px;
                padding: 6px 12px;
                font-size: 0.75rem;
            }

            .stage-area {
                top: 10px !important;
                width: 96vw !important;
                height: 92vh !important;
                max-height: 94vh !important;
                border: 4px solid #8B5A2B !important;
                border-bottom: 10px solid #5C3A21 !important;
            }

            .btn-add {
                bottom: 16px !important;
                right: 20px !important;
                width: 48px !important;
                height: 48px !important;
                font-size: 20px !important;
            }

            .trash-bin {
                bottom: 14px !important;
                left: 18px !important;
                width: 42px !important;
                height: 42px !important;
                font-size: 16px !important;
            }

            .wayang-list {
                bottom: 15px !important;
                max-width: 80vw !important;
                padding: 10px 15px !important;
            }

            .wayang-slot {
                width: 70px !important;
                height: 100px !important;
            }
        }
    </style>
</head>

<body>
    {% include 'layouts/navbar.html' %}

    <!-- TOMBOL CEPAT MODE LANSKAP / LAYAR PENUH -->
    <button class="btn-landscape-mode" id="btnLandscape" onclick="toggleLandscapeMode()" title="Mode Panggung Lanskap Penuh">
        <i class="fas fa-expand"></i> <span class="landscape-btn-text">Lanskap</span>
    </button>

    <!-- NOTIFIKASI PUTAR KE LANSKAP (MUNCUL OTOMATIS SAAT HP DALAM POSISI TEGAK) -->
    <div id="rotateNotice" class="rotate-notice-overlay">
        <div class="rotate-notice-card">
            <div class="rotate-anim-box">
                <i class="fas fa-mobile-alt phone-icon"></i>
                <i class="fas fa-sync-alt arrow-icon"></i>
            </div>
            <h4>Mode Panggung Wayang</h4>
            <p>Untuk panggung yang luas dan leluasa dimainkan, silakan putar smartphone Anda ke posisi <strong>Lanskap (Horizontal)</strong>.</p>
            <div class="rotate-actions">
                <button class="btn-rotate-now" onclick="toggleLandscapeMode()">
                    <i class="fas fa-expand-arrows-alt"></i> Buka Layar Penuh (Lanskap)
                </button>
                <button class="btn-rotate-skip" onclick="dismissRotateNotice()">
                    Tetap di Mode Potret
                </button>
            </div>
        </div>
    </div>

    <div class="panggung"></div>

    <div class="stage-area" id="stageArea">
        <div class="tirai-area"></div>
        <div class="trash-bin" id="trashBin" title="Tarik wayang ke sini untuk menghapus"><i class="fas fa-trash-alt"></i></div>
    </div>

    <div class="wayang-list" id="wayangList">
        {% for w in wayangs %}
        <div class="wayang-slot"
            draggable="true"
            data-badan="{{ url_for('static', filename=w.badan) }}"
            data-tka="{{ url_for('static', filename=w.tangan_kanan_atas) }}"
            data-tkb="{{ url_for('static', filename=w.tangan_kanan_bawah) }}"
            data-tla="{{ url_for('static', filename=w.tangan_kiri_atas) }}"
            data-tlb="{{ url_for('static', filename=w.tangan_kiri_bawah) }}">
            <img src="{{ url_for('static', filename=w.thumbnail) }}" loading="lazy">
        </div>
        {% endfor %}
    </div>

    <button class="btn-add" id="btnAdd" title="Buka Kotak Wayang"><i class="fas fa-box-open"></i></button>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const stage = document.getElementById("stageArea");
            const trash = document.getElementById("trashBin");
            const btnAdd = document.getElementById("btnAdd");
            const wayangList = document.getElementById("wayangList");
            let draggedSlot = null;

            // Toggle Laci
            btnAdd.onclick = () => {
                wayangList.classList.toggle("show");
                if(wayangList.classList.contains("show")) {
                    btnAdd.innerHTML = '<i class="fas fa-times"></i>';
                } else {
                    btnAdd.innerHTML = '<i class="fas fa-box-open"></i>';
                }
            };

            // Fungsi Membuat Wayang ke Panggung
            function spawnWayang(dataBadan, dataTka, dataTkb, dataTla, dataTlb, x, y) {
                const wayang = document.createElement("div");
                wayang.className = "wayang";
                wayang.style.left = x + "px";
                wayang.style.top = y + "px";
                wayang.flipped = false;

                wayang.innerHTML = `
                <img class="badan" src="${dataBadan}">
                <div class="tangan kanan">
                    <div class="lengan-atas">
                        <img src="${dataTka}">
                        <div class="lengan-bawah">
                            <img src="${dataTkb}">
                        </div>
                    </div>
                </div>
                <div class="tangan kiri">
                    <div class="lengan-atas">
                        <img src="${dataTla}">
                        <div class="lengan-bawah">
                            <img src="${dataTlb}">
                        </div>
                    </div>
                </div>
                `;

                stage.appendChild(wayang);
                enableStageDrag(wayang);
                aktifkanRotasiTangan(wayang);
                fallDown(wayang);
                enableDoubleClickFlip(wayang);

                // Pose Awal
                const tKA = wayang.querySelector('.tangan.kanan .lengan-atas');
                const tKB = wayang.querySelector('.tangan.kanan .lengan-bawah');
                const tLA = wayang.querySelector('.tangan.kiri .lengan-atas');
                const tLB = wayang.querySelector('.tangan.kiri .lengan-bawah');

                if(tKA) tKA.style.transform  = 'rotate(-35deg)';
                if(tKB) tKB.style.transform = 'rotate(-55deg)';
                if(tLA) tLA.style.transform  = 'rotate(25deg)';
                if(tLB) tLB.style.transform  = 'rotate(35deg)';
            }

            // Setup Wayang Slot (Bisa Drag di Desktop & Tap 1x di HP)
            document.querySelectorAll(".wayang-slot").forEach(slot => {
                // Desktop Drag & Drop
                slot.addEventListener("dragstart", () => { 
                    draggedSlot = slot; 
                });
                slot.addEventListener("dragend", () => {
                    wayangList.classList.remove("show");
                    btnAdd.innerHTML = '<i class="fas fa-box-open"></i>';
                });

                // Mobile Friendly: Cukup sentuh slot untuk spawn ke panggung!
                slot.addEventListener("click", () => {
                    const rect = stage.getBoundingClientRect();
                    const spawnX = Math.max(15, (rect.width / 2) - 80);
                    const spawnY = Math.max(15, (rect.height / 2) - 100);
                    spawnWayang(
                        slot.dataset.badan,
                        slot.dataset.tka,
                        slot.dataset.tkb,
                        slot.dataset.tla,
                        slot.dataset.tlb,
                        spawnX,
                        spawnY
                    );
                    wayangList.classList.remove("show");
                    btnAdd.innerHTML = '<i class="fas fa-box-open"></i>';
                });
            });

            stage.addEventListener("dragover", e => e.preventDefault());

            stage.addEventListener("drop", e => {
                e.preventDefault();
                if (!draggedSlot) return;
                const rect = stage.getBoundingClientRect();
                const spawnX = e.clientX - rect.left - 45;
                const spawnY = e.clientY - rect.top - 70;
                spawnWayang(
                    draggedSlot.dataset.badan,
                    draggedSlot.dataset.tka,
                    draggedSlot.dataset.tkb,
                    draggedSlot.dataset.tla,
                    draggedSlot.dataset.tlb,
                    spawnX,
                    spawnY
                );
                draggedSlot = null;
            });

            // LOGIKA DRAG & DROP DALAM PANGGUNG (Mendukung Mouse & Touch Layar HP)
            function enableStageDrag(el) {
                let isDrag = false, offsetX = 0, offsetY = 0;

                function startDrag(clientX, clientY) {
                    isDrag = true;
                    const r = el.getBoundingClientRect();
                    offsetX = clientX - r.left;
                    offsetY = clientY - r.top;
                    el.falling = false;
                }

                function moveDrag(clientX, clientY) {
                    if (!isDrag) return;
                    const r = stage.getBoundingClientRect();
                    let x = clientX - r.left - offsetX;
                    let y = clientY - r.top - offsetY;
                    x = Math.max(0, Math.min(r.width - el.clientWidth, x));
                    y = Math.max(0, Math.min(r.height - el.clientHeight, y));
                    el.style.left = x + "px";
                    el.style.top = y + "px";
                    trash.classList.toggle("active", isOverTrash(el));
                }

                function stopDrag() {
                    if (!isDrag) return;
                    isDrag = false;
                    if (isOverTrash(el)) el.remove();
                    else fallDown(el);
                    trash.classList.remove("active");
                }

                // Event Mouse
                el.addEventListener("mousedown", e => { startDrag(e.clientX, e.clientY); });
                document.addEventListener("mousemove", e => { if(isDrag) moveDrag(e.clientX, e.clientY); });
                document.addEventListener("mouseup", stopDrag);

                // Event Touch Layar Sentuh HP
                el.addEventListener("touchstart", e => {
                    if (e.touches.length === 1) {
                        startDrag(e.touches[0].clientX, e.touches[0].clientY);
                    }
                }, { passive: true });

                document.addEventListener("touchmove", e => {
                    if (isDrag && e.touches.length === 1) {
                        moveDrag(e.touches[0].clientX, e.touches[0].clientY);
                    }
                }, { passive: true });

                document.addEventListener("touchend", stopDrag);
            }

            // LOGIKA ROTASI SENDI TANGAN (Mouse & Touch HP)
            function aktifkanRotasiTangan(wayang) {
                wayang.querySelectorAll('.lengan-atas').forEach(atas => {
                    const bawah = atas.querySelector('.lengan-bawah');
                    aktifkanSendi(atas, bawah);
                });
            }

            function aktifkanSendi(atas, bawah) {
                let startY=0, startAtas=0, startBawah=0, mode=null;

                function startJoint(y, selectedMode) {
                    mode = selectedMode;
                    startY = y;
                    startAtas = getRotation(atas);
                    startBawah = getRotation(bawah);
                }

                function moveJoint(y) {
                    if(!mode) return;
                    const delta = startY - y;
                    if(mode==='atas'){
                        atas.style.transform = `rotate(${startAtas + delta*0.6}deg)`;
                        bawah.style.transform = `rotate(${startBawah + delta*0.85}deg)`;
                    }
                    if(mode==='bawah'){
                        bawah.style.transform = `rotate(${startBawah + delta}deg)`;
                        atas.style.transform = `rotate(${startAtas + delta*0.4}deg)`;
                    }
                }

                function stopJoint() {
                    mode = null;
                }

                // Mouse
                atas.addEventListener('mousedown', e => { e.stopPropagation(); startJoint(e.clientY, 'atas'); });
                bawah.addEventListener('mousedown', e => { e.stopPropagation(); startJoint(e.clientY, 'bawah'); });
                document.addEventListener('mousemove', e => { if(mode) moveJoint(e.clientY); });
                document.addEventListener('mouseup', stopJoint);

                // Touch
                atas.addEventListener('touchstart', e => {
                    e.stopPropagation();
                    if(e.touches.length === 1) startJoint(e.touches[0].clientY, 'atas');
                }, { passive: true });

                bawah.addEventListener('touchstart', e => {
                    e.stopPropagation();
                    if(e.touches.length === 1) startJoint(e.touches[0].clientY, 'bawah');
                }, { passive: true });

                document.addEventListener('touchmove', e => {
                    if(mode && e.touches.length === 1) moveJoint(e.touches[0].clientY);
                }, { passive: true });

                document.addEventListener('touchend', stopJoint);
            }

            function getRotation(el){
                const st = window.getComputedStyle(el).transform;
                if(st==='none') return 0;
                const m=st.match(/matrix\(([^)]+)\)/); if(!m) return 0;
                const v=m[1].split(','); return Math.round(Math.atan2(v[1],v[0])*180/Math.PI);
            }

            function isOverTrash(el){
                const w=el.getBoundingClientRect(), t=trash.getBoundingClientRect();
                return !(w.right < t.left - 20 || w.left > t.right + 20 || w.bottom < t.top - 20 || w.top > t.bottom + 20);
            }

            function fallDown(el){
                if(el.falling) return; el.falling=true;
                const rect=stage.getBoundingClientRect();
                const bottom = rect.height - el.clientHeight;
                let y = parseInt(el.style.top)||0;
                const fall=setInterval(()=>{
                    y+=4;
                    if(y>=bottom){ y=bottom; clearInterval(fall); el.falling=false; }
                    el.style.top = y + "px";
                },10);
            }

            function enableDoubleClickFlip(wayang){
                // Double Click / Double Tap untuk membalik hadap wayang
                let lastTap = 0;
                wayang.addEventListener('click', (e) => {
                    const now = Date.now();
                    if (now - lastTap < 300) {
                        wayang.flipped = !wayang.flipped;
                        if(wayang.flipped) wayang.style.transform += ' scaleX(-1)';
                        else wayang.style.transform = wayang.style.transform.replace(' scaleX(-1)','');
                    }
                    lastTap = now;
                });
            }
        });

        // --- FITUR AUTO LANDSCAPE & FULLSCREEN ---
        let rotateDismissed = false;

        function checkOrientation() {
            const isPortraitMobile = window.matchMedia("(max-width: 900px) and (orientation: portrait)").matches;
            const notice = document.getElementById("rotateNotice");
            if (notice) {
                if (isPortraitMobile && !rotateDismissed) {
                    notice.classList.add("active");
                } else {
                    notice.classList.remove("active");
                }
            }
        }

        function dismissRotateNotice() {
            rotateDismissed = true;
            const notice = document.getElementById("rotateNotice");
            if (notice) notice.classList.remove("active");
        }

        async function toggleLandscapeMode() {
            try {
                // 1. Masuk Fullscreen
                if (!document.fullscreenElement) {
                    if (document.documentElement.requestFullscreen) {
                        await document.documentElement.requestFullscreen();
                    } else if (document.documentElement.webkitRequestFullscreen) {
                        await document.documentElement.webkitRequestFullscreen();
                    }
                }
                // 2. Kunci orientasi ke Landscape (didukung oleh Android Chrome/Edge/Firefox)
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape').catch(() => {});
                }
                dismissRotateNotice();
            } catch (e) {
                console.log("Fullscreen/Lock error:", e);
                dismissRotateNotice();
            }
        }

        window.addEventListener("resize", checkOrientation);
        window.addEventListener("orientationchange", checkOrientation);
        setTimeout(checkOrientation, 350);
    </script>
</body>
