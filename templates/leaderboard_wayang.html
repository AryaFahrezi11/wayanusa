<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard Quiz Wayang - WAYANUSA</title>
    <meta name="description" content="Lihat peringkat pemain terbaik dalam quiz wayang kulit WAYANUSA.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@400;700&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/leaderboard_wayang.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo_2.png') }}">
</head>

<body>
    {% include 'layouts/navbar.html' %}

    <section class="leaderboard-section">
        <div class="container">
            <div class="leaderboard-content">
                <p class="leaderboard-tag">🏆 LEADERBOARD</p>
                <h2 class="leaderboard-title">Peringkat <span class="highlight">Terbaik</span></h2>
                <p class="leaderboard-description">
                    Lihat para juara yang menguasai pengetahuan wayang kulit. Pilih level untuk melihat leaderboard
                    spesifik.
                </p>

                <div class="level-selector">
                    <select id="level-select" aria-label="Pilih Level Quiz">
                        <option value="Beginner">🌱 Beginner</option>
                        <option value="Intermediate">⚡ Intermediate</option>
                        <option value="Advanced">🔥 Advanced</option>
                        <option value="Expert">💎 Expert</option>
                    </select>
                </div>

                <div id="podium" class="podium">
                    <div class="loading-spinner"></div>
                </div>

                <div class="leaderboard-table">
                    <table>
                        <thead>
                            <tr>
                                <th>Rank</th>
                                <th>Nama Peserta</th>
                                <th>Level Quiz</th>
                                <th>Skor</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-tbody">
                            <!-- Table rows will be rendered here -->
                        </tbody>
                    </table>
                </div>

                <div id="user-position" class="user-position">
                    <!-- User position text will be rendered here -->
                </div>
            </div>
        </div>
    </section>
    {% include 'components/chatbot.html' %}

    <script src="{{ url_for('static', filename='js/chatbot.js') }}"></script>
    <script src="{{ url_for('static', filename='js/leaderboard_wayang.js') }}"></script>
</body>

</html>
